<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>compound-return-calculator</title>
    </head>
    <body>
        <main class="w-full flex flex-col p-10!">
            <form id="form" class="flex flex-col gap-6 mx-auto! w-[400px] max-w-full">
                <!-- Starting Balance -->
                <div class="flex flex-col gap-2">
                    <label for="starting_balance">
                        <small>What is your starting balance? (£)</small>
                    </label>
                    <input
                        type="number"
                        id="starting_balance"
                        required
                        min="0"
                        class="border border-gray-600 bg-gray-600/30 p-2! rounded"
                    />
                </div>
                <!-- Yearly Investment -->
                <div class="flex flex-col gap-2">
                    <label for="invest">
                        <small>How much money will you invest per year? (£)</small>
                    </label>
                    <input type="number" id="invest" required min="0" class="border border-gray-600 bg-gray-600/30 p-2! rounded" />
                </div>
                <!-- Average Interest -->
                <div class="flex flex-col gap-2">
                    <label for="interest">
                        <small>What is the average interest per year? (%)</small>
                    </label>
                    <input type="number" id="interest" required min="0" class="border border-gray-600 bg-gray-600/30 p-2! rounded" />
                </div>
                <!-- Years to calculate -->
                <div class="flex flex-col gap-2">
                    <label for="years">
                        <small>How many years would you like to calculate for?</small>
                    </label>
                    <input type="number" id="years" required min="1" class="border border-gray-600 bg-gray-600/30 p-2! rounded" />
                </div>
                <button type="submit" class="bg-gray-700 p-3! rounded mt-3!">Calculate</button>
            </form>
            <div id="results"></div>
            <hr class="my-10!" />
            <h1>RESULTS</h1>
            <canvas id="myChart" class="mt-10!"></canvas>
        </main>
        <script type="module" src="script.ts"></script>
    </body>
</html>

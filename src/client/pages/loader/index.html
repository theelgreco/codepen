<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>loader</title>
    </head>
    <body>
        <div style="height: 50px; width: 50px">
            <div class="loader" data-num-hands="20" data-animation-duration="600"></div>
        </div>
        <button class="btn" onclick="this.classList.toggle('loading')">
            <p style="font-size: 0.8rem">Click me</p>
            <div class="loader" data-num-hands="20" data-animation-duration="600" style="height: 13px"></div>
            <svg class="icon" width="10px" height="10px" stroke="white">
                <path d="M 5 0 L 5 10 M 0 5 L 10 5"></path>
            </svg>
        </button>
        <loading-spinner size="40" hands="20" duration="300"></loading-spinner>
        <script type="module" src="script.ts"></script>
        <script type="module" src="component.ts"></script>
    </body>
</html>
